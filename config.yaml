# ============================================================
# 军事数据集评测框架 · 全局配置
# ============================================================

# 数据文件配置
data:
  path: data/raw/military_data.jsonl
  max_docs: -1                # -1 = 使用全部文档
  encoding: utf-8

# ============================================================
# 多字段评测配置
# 根据你的数据中的不同字段，使用不同的评测策略
# ============================================================
fields:
  # 字段1: 原始content字段 - 完整评测
  content:
    enabled: true
    description: "原始军事文本内容"
    static_eval: true
    probe_tasks:
      - ner        # 军事NER探针
      - event      # 事件抽取探针
      - qa         # QA探针（可从content构建）

  # 字段2: QA合成字段 - 专用QA评测
  synthesized_content_QA:
    enabled: true
    description: "包含QA对的合成文本"
    static_eval: true
    # QA字段已经有QA对，可以直接用于QA评测
    qa_format: "json"  # json格式: {"question": "...", "answer": "..."}
    probe_tasks:
      - qa_direct  # 直接使用QA对评测

  # 字段3: Wiki改写字段 - 质量评测
  synthesized_Wikipedia-style_rephrasing:
    enabled: true
    description: "Wiki百科风格改写"
    static_eval: true
    # 改写文本质量评估
    probe_tasks:
      - quality    # 改写质量评测
      - coherence  # 连贯性评测

# ============================================================
# 模型配置
# ============================================================
model:
  base_model: Qwen/Qwen2.5-7B
  tokenizer: Qwen/Qwen2.5-7B
  dtype: float16              # 改为 float16，更兼容
  output_dir: output/checkpoints
  # 继续预训练超参
  learning_rate: 2.0e-5
  num_train_epochs: 3
  per_device_train_batch_size: 2  # 减小 batch size
  gradient_accumulation_steps: 16  # 增加梯度累积
  max_seq_length: 1024            # 减小序列长度
  warmup_ratio: 0.03
  logging_steps: 50
  save_steps: 1000
  use_lora: true
  lora_rank: 8               # 减小 LoRA rank
  lora_alpha: 16             # 相应减小 alpha
  lora_dropout: 0.05

# ============================================================
# 静态评测配置
# ============================================================
static_eval:
  # 参考语料（用于 MAUVE 分布对比）
  reference_corpus: CMNEE       # 可选: CMNEE / ND-NER / custom
  reference_path: ""            # 留空则自动下载
  ngram_sizes: [4, 8, 16]
  # 脱敏扫描
  desensitize:
    enabled: true
    patterns:
      - '\\d{4,5}[-–—]\\d{4,5}'   # 番号
      - '[A-Z]{2,5}-\\d+'          # 装备编号
    ner_model: ""                 # 留空则跳过 NER 脱敏

# ============================================================
# 探针任务配置
# ============================================================
probe_ner:
  enabled: false
  dataset: ND-NER
  dataset_path: "data/processed/nd_ner"  # ND-NER 数据路径
  test_split: test
  eval_metric: seqeval            # strict 实体级评测
  num_labels: 19                  # ND-NER 实体类别数
  fine_tune_epochs: 2
  batch_size: 4
  learning_rate: 5.0e-5

probe_event:
  enabled: false
  dataset: CMNEE
  dataset_path: ""
  test_split: test
  fine_tune_epochs: 3
  batch_size: 8
  learning_rate: 3.0e-5

probe_qa:
  enabled: false
  num_questions: 500
  question_types:
    - 军语解释
    - 战术分析
    - 条令问答
    - 装备对比
  judge_model: ""  # 留空则使用规则评分，不调用大模型
  retrieval_top_k: 5

# ============================================================
# 报告配置
# ============================================================
report:
  output_dir: output/reports
  figures_dir: output/figures
  metrics_dir: output/metrics
  formats: [markdown, html, json]
